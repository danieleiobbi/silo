services:
  silo:
    image: ghcr.io/danieleiobbi/silo:${SILO_VERSION:?Set SILO_VERSION to a published vX.Y.Z tag}
    restart: unless-stopped
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      PORT: 3000
      SILO_ADMIN_USERNAME: ${SILO_ADMIN_USERNAME:?Set SILO_ADMIN_USERNAME in .env}
      SILO_ADMIN_PASSWORD_HASH: ${SILO_ADMIN_PASSWORD_HASH:?Set SILO_ADMIN_PASSWORD_HASH in .env}
      SILO_PUBLIC_ORIGIN: ${SILO_PUBLIC_ORIGIN:?Set SILO_PUBLIC_ORIGIN in .env}
      SILO_UPLOAD_MAX_MIB: ${SILO_UPLOAD_MAX_MIB:-100}
    ports:
      - "127.0.0.1:${SILO_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
